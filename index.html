<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MyfitnessBitch</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MyfitnessBitch">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F3EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1410" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one phone-width column, calorie ring up top, meals as stacked lists, fixed bottom tab bar */
:root{
  --bg:#F2F3EC; --surface:#FFFFFF; --sunk:#E7E9E0; --ink:#16201A; --muted:#5D6960; --line:#D9DCD1;
  --accent:#F2462A; --accent-ink:#FFFFFF; --good:#2E8B57;
  --protein:#3566D6; --carbs:#D9930A; --fat:#B83A72;
  --display:"Archivo Black","Arial Black",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --num:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1410; --surface:#171E18; --sunk:#202922; --ink:#EAF0EA; --muted:#97A39A; --line:#2B352D;
  --accent:#FF5B3D; --accent-ink:#1A0A06; --good:#4CC284;
  --protein:#6F95F0; --carbs:#F0B335; --fat:#E2679E; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1410; --surface:#171E18; --sunk:#202922; --ink:#EAF0EA; --muted:#97A39A; --line:#2B352D;
  --accent:#FF5B3D; --accent-ink:#1A0A06; --good:#4CC284;
  --protein:#6F95F0; --carbs:#F0B335; --fat:#E2679E; color-scheme:dark }
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;-webkit-text-size-adjust:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px calc(96px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;
  font-family:var(--display);font-size:17px;flex:none;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.brand h1{font-family:var(--display);font-size:20px;margin:0;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.datebar{display:flex;align-items:center;gap:4px}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px;line-height:1}
.datebar .lbl{font-weight:700;min-width:84px;text-align:center;font-size:14px}
.sync{font-size:12px;color:var(--muted);text-align:right;margin-top:-10px}

.summary{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .big{font-family:var(--num);font-weight:700;font-size:26px;line-height:1}
.ring .cap{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:4px}
.eq{display:flex;flex-direction:column;gap:10px;min-width:0}
.eqrow{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.eqrow b{color:var(--ink);font-family:var(--num);font-weight:700}
.macros{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.macro .t{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:4px}
.macro .t b{font-family:var(--num);color:var(--ink);font-weight:700}
.bar{height:7px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:99px}

.meal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.meal-h{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;gap:8px}
.meal-h h2{margin:0;font-family:var(--display);font-size:16px;letter-spacing:.01em}
.meal-h .k{font-family:var(--num);font-size:13px;color:var(--muted)}
.entry{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.entry .info{flex:1;min-width:0}
.entry .n{font-weight:600;overflow-wrap:anywhere}
.entry .s{font-size:12px;color:var(--muted)}
.entry .kc{font-family:var(--num);font-weight:700;font-size:14px}
.entry .x{border:0;background:none;color:var(--muted);font-size:18px;width:30px;height:30px;border-radius:8px}
.entry .x:hover{background:var(--sunk);color:var(--ink)}
.addrow{width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:11px 14px;color:var(--accent);font-weight:700}
.empty{padding:2px 14px 12px;color:var(--muted);font-size:13px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font-family:var(--display);font-size:17px}
.muted{color:var(--muted)}
.small{font-size:13px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=search],textarea,select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:16px}
textarea{resize:vertical;min-height:84px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.btn{border:0;border-radius:11px;padding:12px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 64px 1fr 1fr;align-items:center;gap:4px}
nav.tabs button.t{border:0;background:none;padding:6px 0;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button.t[aria-current="page"]{color:var(--ink)}
nav.tabs button.t svg{width:22px;height:22px}
nav.tabs .plus{width:56px;height:56px;margin:-26px auto 0;border-radius:18px;border:4px solid var(--bg);background:var(--accent);color:var(--accent-ink);font-size:30px;line-height:1;font-weight:700}

.sheet-bg{position:fixed;inset:0;z-index:30;background:rgba(10,14,11,.45)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surface);border-radius:20px 20px 0 0;max-height:88%;display:flex;flex-direction:column;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .in{max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:12px;min-height:0;flex:1}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet-h h2{margin:0;font-family:var(--display);font-size:18px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:11px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 4px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.scroll{overflow-y:auto;min-height:0;flex:1;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.food{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--bg);text-align:left;width:100%}
.food .info{flex:1;min-width:0}
.food .n{font-weight:600}
.food .s{font-size:12px;color:var(--muted)}
.food .kc{font-family:var(--num);font-weight:700}
.tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;padding:2px 6px;border-radius:6px;background:var(--sunk);color:var(--muted);margin-left:6px;vertical-align:1px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:20px}
.stepper input{width:80px;text-align:center}
.picked{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.mbadges{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.mbadges b{font-family:var(--num);color:var(--ink)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}

.chart{width:100%;height:auto;display:block}
.note{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:10px;padding:10px 12px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:90%}
@media (max-width:380px){.summary{grid-template-columns:1fr;justify-items:center}.eq{width:100%}}
@media (prefers-reduced-motion:no-preference){.bar i,.ring circle{transition:all .4s ease}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><div class="logo" id="logo"><img alt="" src="icon-192.png"></div><h1>MyfitnessBitch</h1></div>
    <div class="datebar">
      <button class="iconbtn" id="prevDay" aria-label="Previous day">‹</button>
      <div class="lbl" id="dateLbl">Today</div>
      <button class="iconbtn" id="nextDay" aria-label="Next day">›</button>
    </div>
  </header>
  <div class="sync" id="sync">Loading your log…</div>

  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Sections"><div class="in">
  <button class="t" data-tab="diary" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Diary</button>
  <button class="t" data-tab="foods"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 3v8a3 3 0 0 0 6 0V3M10 3v18M17 3c-2 2-2 6 0 8v10"/></svg>My foods</button>
  <button class="plus" id="plusBtn" aria-label="Add food">+</button>
  <button class="t" data-tab="trends"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Trends</button>
  <button class="t" data-tab="goals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>Goals</button>
</div></nav>

<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<script>
(() => {
// Built-in foods: [name, serving, kcal, protein g, carbs g, fat g]
const BUILTIN = [
["Egg, large","1 egg",72,6.3,0.4,4.8],["Egg whites","100 g",52,11,0.7,0.2],["Chicken breast, cooked","100 g",165,31,0,3.6],
["Chicken thigh, cooked","100 g",209,26,0,10.9],["Ground beef 85/15, cooked","100 g",250,26,0,15],["Steak, sirloin, cooked","100 g",206,30,0,9],
["Salmon, cooked","100 g",206,22,0,12],["Tuna, canned in water","1 can (142 g)",120,26,0,1],["Shrimp, cooked","100 g",99,24,0.2,0.3],
["Turkey slices","56 g",60,10,2,1],["Bacon","2 slices",86,6,0.2,6.7],["Pork chop, cooked","100 g",231,26,0,14],
["Tofu, firm","100 g",144,17,3,9],["Greek yogurt, plain nonfat","170 g",100,17,6,0.7],["Cottage cheese 2%","1/2 cup",90,12,5,2.5],
["Milk, 2%","1 cup",122,8,12,5],["Milk, whole","1 cup",149,8,12,8],["Cheddar cheese","28 g",113,7,0.4,9.3],
["Mozzarella","28 g",85,6,1,6],["Butter","1 tbsp",102,0.1,0,11.5],["Whey protein","1 scoop (30 g)",120,24,3,1.5],
["White rice, cooked","1 cup",205,4.3,45,0.4],["Brown rice, cooked","1 cup",216,5,45,1.8],["Pasta, cooked","1 cup",221,8,43,1.3],
["Oats, dry","1/2 cup (40 g)",150,5,27,2.5],["Bread, white","1 slice",75,2.6,14,1],["Bread, whole wheat","1 slice",81,4,14,1.1],
["Bagel","1 medium",277,11,55,1.4],["Tortilla, flour","1 (45 g)",140,4,24,3.5],["Potato, baked","1 medium",161,4.3,37,0.2],
["Sweet potato, baked","1 medium",103,2.3,24,0.2],["French fries","medium serving",365,4,48,17],["Cereal, corn flakes","1 cup",100,2,24,0],
["Granola","1/2 cup",300,7,32,15],["Pancake","1 medium",90,2.5,11,3.5],["Quinoa, cooked","1 cup",222,8,39,3.6],
["Banana","1 medium",105,1.3,27,0.4],["Apple","1 medium",95,0.5,25,0.3],["Orange","1 medium",62,1.2,15,0.2],
["Strawberries","1 cup",49,1,12,0.5],["Blueberries","1 cup",84,1.1,21,0.5],["Grapes","1 cup",104,1.1,27,0.2],
["Avocado","1/2 fruit",120,1.5,6,11],["Broccoli","1 cup",31,2.5,6,0.3],["Spinach, raw","2 cups",14,1.7,2.2,0.2],
["Carrots","1 medium",25,0.6,6,0.1],["Salad mix","2 cups",15,1,3,0],["Tomato","1 medium",22,1.1,4.8,0.2],
["Peanut butter","2 tbsp",190,7,7,16],["Almonds","28 g",164,6,6,14],["Olive oil","1 tbsp",119,0,0,13.5],
["Hummus","2 tbsp",70,2,4,5],["Black beans, cooked","1/2 cup",114,7.6,20,0.5],["Lentils, cooked","1/2 cup",115,9,20,0.4],
["Dark chocolate 70%","28 g",170,2.2,13,12],["Potato chips","28 g",152,2,15,10],["Ice cream, vanilla","1/2 cup",137,2.3,16,7],
["Cookie, chocolate chip","1 medium",78,1,10,4],["Donut, glazed","1",240,4,31,11],["Protein bar","1 bar",200,20,22,7],
["Pizza, cheese","1 slice",285,12,36,10],["Burger, single","1",354,17,29,17],["Chicken nuggets","6 pieces",280,14,17,17],
["Burrito, chicken","1",550,30,60,20],["Sushi roll, california","8 pieces",255,9,38,7],["Ramen, instant","1 pack",380,8,52,14],
["Mac and cheese","1 cup",310,11,40,12],["Fried rice","1 cup",238,5.5,45,4],["Spaghetti with meat sauce","1 cup",290,15,36,9],
["Coffee, black","1 cup",2,0.3,0,0],["Latte, 2% milk","16 oz",190,12,18,7],["Orange juice","1 cup",112,1.7,26,0.5],
["Soda, cola","12 oz can",140,0,39,0],["Beer","12 oz",153,1.6,13,0],["Wine, red","5 oz",125,0.1,4,0],
["Energy drink","16 oz can",210,0,54,0],["Sports drink","20 oz",130,0,34,0]
];
const MEALS = ["Breakfast","Lunch","Dinner","Snacks"];
// Lean bulk for 5'8", 155 lb: about maintenance + a small surplus, ~1 g protein per lb
const DEFAULT_GOALS = {kcal:2400, protein:150, carbs:300, fat:65};
const OLD_DEFAULT_GOALS = {kcal:2200, protein:150, carbs:220, fat:70};

const $ = s => document.querySelector(s);
const el = (tag, props = {}, kids = []) => { const e = document.createElement(tag); for (const [k,v] of Object.entries(props)) {
  if (k === "class") e.className = v; else if (k === "text") e.textContent = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
  else if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v); } for (const c of [].concat(kids)) if (c != null) e.append(c); return e; };
const r1 = n => Math.round((+n || 0) * 10) / 10;
const ri = n => Math.round(+n || 0);
const uid8 = () => Math.random().toString(36).slice(2, 10);
const dkey = d => { const z = new Date(d); z.setMinutes(z.getMinutes() - z.getTimezoneOffset()); return z.toISOString().slice(0, 10); };
const todayKey = () => dkey(new Date());
const addDays = (key, n) => { const d = new Date(key + "T12:00:00"); d.setDate(d.getDate() + n); return dkey(d); };

const state = {
  mode: "starting",            // "cloud" | "local"
  date: todayKey(),
  tab: "diary",
  profile: { goals: { ...DEFAULT_GOALS }, foods: [], recents: [] },
  day: { entries: [] },
  sample: null,
};

// ---------- storage: this phone's browser storage ----------
let db = null, uid = null, profRef = null, unsubDay = null;
const LS = {
  get(k, f) { try { const v = localStorage.getItem("mfb:" + k); return v ? JSON.parse(v) : f; } catch { return f; } },
  set(k, v) { try { localStorage.setItem("mfb:" + k, JSON.stringify(v)); } catch {} },
};
// One write at a time per document
const chains = {};
function queueWrite(key, fn) { chains[key] = (chains[key] || Promise.resolve()).then(fn).catch(e => { console.warn(e); toast("Couldn't save. Check your connection."); }); return chains[key]; }
const dayRef = key => profRef.collection("days").doc(key);

function saveProfile() {
  const body = JSON.parse(JSON.stringify(state.profile));
  LS.set("profile", body);
  if (state.mode === "cloud") queueWrite("profile", () => profRef.set(body));
}
function saveDay() {
  const key = state.date, body = { date: key, entries: JSON.parse(JSON.stringify(state.day.entries)) };
  LS.set("day:" + key, body);
  if (state.mode === "cloud") queueWrite("day:" + key, () => dayRef(key).set(body));
}
function watchDay() {
  if (unsubDay) { unsubDay(); unsubDay = null; }
  const key = state.date;
  state.day = { entries: (LS.get("day:" + key, { entries: [] }).entries) || [] };
  render();
  if (state.mode !== "cloud") return;
  unsubDay = dayRef(key).onSnapshot(s => {
    if (key !== state.date) return;
    state.day = { entries: s.exists ? (s.data().entries || []) : [] };
    LS.set("day:" + key, { date: key, entries: state.day.entries });
    render();
  }, () => setSync("Lost connection to your account. Changes stay on this phone for now."));
}
function setSync(t) { $("#sync").textContent = t; }

async function boot() {
  const p = LS.get("profile", null); if (p) state.profile = normProfile(p);
  state.mode = "local";
  // Ask the browser not to clear this site's data when storage runs low
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch {}
  setSync("Saved on this phone · back up in Goals");
  watchDay();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
}
function normProfile(p) {
  // Goals never changed from the first version's defaults: move them to the new defaults
  const g = p.goals || {}, untouched = Object.keys(OLD_DEFAULT_GOALS).every(k => g[k] === OLD_DEFAULT_GOALS[k]);
  return { goals: untouched ? { ...DEFAULT_GOALS } : { ...DEFAULT_GOALS, ...g }, foods: Array.isArray(p.foods) ? p.foods : [], recents: Array.isArray(p.recents) ? p.recents : [] };
}

// ---------- totals ----------
function totals(entries) {
  return entries.reduce((t, e) => { const q = +e.qty || 1; t.kcal += e.kcal * q; t.protein += e.p * q; t.carbs += e.c * q; t.fat += e.f * q; return t; },
    { kcal: 0, protein: 0, carbs: 0, fat: 0 });
}

// ---------- views ----------
function render() {
  const lbl = state.date === todayKey() ? "Today" : state.date === addDays(todayKey(), -1) ? "Yesterday"
    : new Date(state.date + "T12:00:00").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
  $("#dateLbl").textContent = lbl;
  $("#nextDay").disabled = state.date >= todayKey();

    const p = j.product, n = p.nutriments || {};
    const perServing = n["energy-kcal_serving"] != null;
    const pick = k => +(perServing ? n[k + "_serving"] : n[k + "_100g"]) || 0;
    let kcal = perServing ? +n["energy-kcal_serving"] : +n["energy-kcal_100g"];
    if (!kcal && n["energy_100g"]) kcal = +n["energy_100g"] / 4.184;   // only kJ given
    const brand = p.brands ? p.brands.split(",")[0].trim() : "", title = (p.product_name || "").trim();
    const name = (brand && !title.toLowerCase().includes(brand.toLowerCase()) ? brand + " " + title : title || brand).trim() || "Scanned food " + code;
    if (state.sheet !== s) return;
    s.picked = { name: name.slice(0, 80), serving: perServing ? (p.serving_size || "1 serving") : "100 g", kcal: r1(kcal), p: r1(pick("proteins")), c: r1(pick("carbohydrates")), f: r1(pick("fat")) };
    s.qty = 1; renderSheet();
  } catch { status.textContent = "Couldn't reach the food database. Check your connection."; }
}

function sheetQuick(body) {
  const s = state.sheet;
  const form = el("form", { style: "display:flex;flex-direction:column;gap:10px" }, [
    el("label", { class: "f" }, ["What did you eat?", el("input", { type: "text", id: "q-name", placeholder: "e.g. Leftover tacos" })]),
    el("div", { class: "grid4" }, [numField("kcal", "q-kcal"), numField("Protein g", "q-p"), numField("Carbs g", "q-c"), numField("Fat g", "q-f")]),
    el("label", { class: "row small", style: "font-weight:600;color:var(--muted)" }, [el("input", { type: "checkbox", id: "q-save" }), "Also save to My foods"]),
    el("button", { class: "btn", type: "submit", text: "Add to " + s.meal })]);
  form.addEventListener("submit", ev => { ev.preventDefault(); const g = id => form.querySelector("#" + id).value;
    const f = { id: uid8(), name: g("q-name").trim() || "Quick add", serving: "1 serving", kcal: +g("q-kcal") || 0, p: +g("q-p") || 0, c: +g("q-c") || 0, f: +g("q-f") || 0 };
    if (!f.kcal && !f.p && !f.c && !f.f) return toast("Enter at least the calories");
    if (form.querySelector("#q-save").checked) { state.profile.foods.unshift(f); }
    logFood(f, 1); toast("Added " + f.name); closeSheet(); render(); });
  body.append(form);
}
function sheetAI(body) {
  const s = state.sheet;
  if (!s.ai) s.ai = { text: "", busy: false, items: null, err: "" };
  const a = s.ai;
  const box = el("textarea", { id: "aiText", placeholder: "e.g. 2 scrambled eggs, 2 slices of toast with butter and a large iced coffee with oat milk" }, []);
  box.value = a.text; box.addEventListener("input", () => a.text = box.value);
  const go = el("button", { class: "btn", type: "button", text: a.busy ? "Estimating…" : "Estimate", disabled: a.busy, onclick: estimate });
  body.append(el("p", { class: "muted small", style: "margin:0", text: "Describe what you ate in plain words and Claude estimates the calories and macros. Check the numbers before adding." }), box, go);
  if (a.err) body.append(el("div", { class: "note", text: a.err }));
  if (a.items) {
    const tot = a.items.reduce((t, i) => ({ k: t.k + i.kcal, p: t.p + i.p, c: t.c + i.c, f: t.f + i.f }), { k: 0, p: 0, c: 0, f: 0 });
    for (const it of a.items) body.append(el("div", { class: "food" }, [el("div", { class: "info" }, [el("div", { class: "n", text: it.name }),
      el("div", { class: "s", text: `${it.serving} · P ${r1(it.p)} · C ${r1(it.c)} · F ${r1(it.f)}` })]), el("span", { class: "kc", text: ri(it.kcal) })]));
    body.append(el("div", { class: "mbadges" }, [el("span", {}, ["Total ", el("b", { text: ri(tot.k) }), " kcal"]), el("span", {}, ["P ", el("b", { text: ri(tot.p) + "g" })]), el("span", {}, ["C ", el("b", { text: ri(tot.c) + "g" })]), el("span", {}, ["F ", el("b", { text: ri(tot.f) + "g" })])]),
      el("button", { class: "btn", type: "button", text: `Add all to ${s.meal}`, onclick: () => { for (const it of a.items) logFood({ ...it }, 1); toast(`Added ${a.items.length} item${a.items.length > 1 ? "s" : ""}`); closeSheet(); render(); } }));
  }
  async function estimate() {
    if (!a.text.trim() || !state.sample) return;
    a.busy = true; a.err = ""; a.items = null; renderSheet();
    try {
      const res = await state.sample.json(
        "Estimate the nutrition of this meal description. Split it into separate food items with realistic US portion sizes. " +
        'Reply with only a JSON array like [{"name":"Scrambled eggs","serving":"2 large eggs","kcal":182,"protein":12,"carbs":2,"fat":14}]. ' +
        "Numbers are totals for that serving, grams for macros.\n\nMeal: " + a.text.slice(0, 1500), { modelTier: "quick" });
      const items = (Array.isArray(res) ? res : []).map(i => ({ name: String(i.name || "Food").slice(0, 80), serving: String(i.serving || "1 serving").slice(0, 60),
        kcal: Math.max(0, +i.kcal || 0), p: Math.max(0, +i.protein || 0), c: Math.max(0, +i.carbs || 0), f: Math.max(0, +i.fat || 0) })).filter(i => i.kcal || i.p || i.c || i.f);
      if (!items.length) a.err = "Couldn't make sense of that. Try listing the foods and amounts.";
      else a.items = items;
    } catch (e) {
      a.err = e && (e.code === "not_granted" || e.code === "sampling_disabled") ? "Describe it needs permission to use Claude. Use Search or Quick add instead."
        : e && e.code === "rate_limited" ? "Too many estimates right now. Try again in a bit." : "Couldn't get an estimate. Try again.";
      if (e && (e.code === "not_granted" || e.code === "sampling_disabled")) state.sample = null;
    }
    a.busy = false; if (state.sheet && state.sheet.ai === a) renderSheet();
  }
}

// ---------- chrome ----------
let toastT;
function toast(t) { clearTimeout(toastT); $("#toastRoot").replaceChildren(el("div", { class: "toast", role: "status", text: t })); toastT = setTimeout(() => $("#toastRoot").replaceChildren(), 1800); }
$("#prevDay").addEventListener("click", () => { state.date = addDays(state.date, -1); watchDay(); });
$("#nextDay").addEventListener("click", () => { if (state.date < todayKey()) { state.date = addDays(state.date, 1); watchDay(); } });
$("#plusBtn").addEventListener("click", () => openAdd());
document.querySelectorAll("nav.tabs button.t").forEach(b => b.addEventListener("click", () => { state.tab = b.dataset.tab; render(); window.scrollTo(0, 0); }));
document.addEventListener("keydown", e => { if (e.key === "Escape" && state.sheet) closeSheet(); });

render();
boot();
})();
</script>
</body>
